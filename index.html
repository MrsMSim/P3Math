<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraction Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF1DE;
    --ink: #3B2A20;
    --ink-soft: #6B584A;
    --card: #FFFFFF;
    --plum: #7B3F61;
    --plum-dark: #5E2F4B;
    --ring: #E8A63B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(123,63,97,0.06) 0, transparent 40%),
      radial-gradient(circle at 92% 88%, rgba(232,166,59,0.10) 0, transparent 40%);
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 48px 16px 60px;
  }
  .wrap { width: 100%; max-width: 760px; }
  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 6vw, 42px);
    margin: 0 0 6px;
    color: var(--plum-dark);
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: var(--ink-soft);
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 36px;
  }
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 560px) {
    .cards { grid-template-columns: 1fr; }
  }
  a.card {
    background: var(--card);
    border-radius: 22px;
    padding: 26px 22px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 4px 0 #EEDFC4, 0 4px 14px rgba(59,42,32,0.07);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    display: block;
  }
  a.card:hover { transform: translateY(-4px); }
  a.card:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }
  .emoji { font-size: 40px; display: block; margin-bottom: 10px; }
  .card h2 {
    font-family: 'Fredoka', sans-serif;
    font-size: 22px;
    margin: 0 0 8px;
    color: var(--plum-dark);
  }
  .card p {
    margin: 0;
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .play {
    display: inline-block;
    margin-top: 14px;
    font-weight: 700;
    color: var(--plum);
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fraction Games</h1>
  <p class="subtitle">Pick a game to practise fractions!</p>
  <div class="cards">
    <a class="card" href="pie-match.html">
      <span class="emoji">🥧</span>
      <h2>Fraction Pie Match</h2>
      <p>Find the 3 pairs of pies that show the same amount, even though they're cut differently.</p>
      <span class="play">Play →</span>
    </a>
    <a class="card" href="picture-match.html">
      <span class="emoji">🎯</span>
      <h2>Fraction to Picture Match</h2>
      <p>Read a fraction like 3/4, then pick the one picture that shows exactly that much.</p>
      <span class="play">Play →</span>
    </a>
  </div>
</div>
</body>
</html>
