<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraction to Picture Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF1DE;
    --ink: #3B2A20;
    --ink-soft: #6B584A;
    --card: #FFFFFF;
    --plum: #7B3F61;
    --plum-dark: #5E2F4B;
    --success: #4C9A5B;
    --success-bg: #E7F3E9;
    --error: #C4453A;
    --error-bg: #FBEAE8;
    --ring: #E8A63B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(123,63,97,0.06) 0, transparent 40%),
      radial-gradient(circle at 92% 88%, rgba(232,166,59,0.10) 0, transparent 40%);
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 28px 16px 60px;
  }

  .wrap { width: 100%; max-width: 720px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(26px, 5vw, 36px);
    margin: 0;
    color: var(--plum-dark);
    letter-spacing: -0.01em;
  }

  .subtitle {
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 16px;
    font-weight: 600;
  }

  .badges { display: flex; gap: 10px; }

  .badge {
    background: var(--card);
    border: 2px solid #EEDFC4;
    border-radius: 14px;
    padding: 8px 14px;
    text-align: center;
    min-width: 74px;
    box-shadow: 0 2px 0 #EEDFC4;
  }

  .badge .num {
    font-family: 'Fredoka', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--plum);
    line-height: 1;
  }

  .badge .lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    font-weight: 700;
  }

  .prompt {
    background: var(--card);
    border-radius: 20px;
    padding: 22px 20px;
    margin: 20px 0 22px;
    text-align: center;
    box-shadow: 0 3px 0 #EEDFC4, 0 4px 12px rgba(59,42,32,0.06);
  }

  .prompt .lead {
    font-weight: 700;
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0 0 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .prompt .frac {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 52px;
    line-height: 1;
    display: inline-block;
  }

  .prompt .frac .n { display: block; padding-bottom: 6px; border-bottom: 5px solid var(--ink); }
  .prompt .frac .d { display: block; padding-top: 6px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  @media (min-width: 560px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 16px 10px;
    text-align: center;
    cursor: pointer;
    border: 3px solid transparent;
    box-shadow: 0 4px 0 #EEDFC4, 0 4px 10px rgba(59,42,32,0.06);
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    user-select: none;
  }

  .card:hover { transform: translateY(-3px); }
  .card:focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; }

  .card.correct {
    border-color: var(--success);
    box-shadow: 0 4px 0 var(--success), 0 6px 14px rgba(76,154,91,0.25);
    animation: pop 0.4s ease;
  }

  .card.incorrect {
    border-color: var(--error);
    animation: shake 0.35s ease;
  }

  .card.reveal {
    border-color: var(--success);
    box-shadow: 0 4px 0 var(--success);
  }

  .card.disabled { pointer-events: none; opacity: 0.55; }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .plate {
    width: 100%;
    max-width: 108px;
    margin: 0 auto;
    filter: drop-shadow(0 3px 2px rgba(59,42,32,0.15));
  }

  .feedback {
    margin-top: 20px;
    border-radius: 16px;
    padding: 16px 20px;
    font-weight: 700;
    font-size: 16px;
    min-height: 26px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .feedback.idle { background: transparent; color: var(--ink-soft); font-weight: 600; }
  .feedback.good { background: var(--success-bg); color: var(--success); }
  .feedback.bad { background: var(--error-bg); color: var(--error); }

  footer {
    margin-top: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .newq {
    background: var(--plum);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 12px 22px;
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--plum-dark);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .newq:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--plum-dark); }
  .newq:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

  .hint { font-size: 13px; color: var(--ink-soft); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .card, .newq { transition: none; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Fraction to Picture Match</h1>
      <p class="subtitle">Pick the pie that shows the fraction.</p>
    </div>
    <div class="badges">
      <div class="badge"><div class="num" id="scoreNum">0</div><div class="lbl">Correct</div></div>
      <div class="badge"><div class="num" id="streakNum">0</div><div class="lbl">Streak</div></div>
    </div>
  </header>

  <div class="prompt">
    <p class="lead">Which picture shows...</p>
    <div class="frac" id="targetFrac"></div>
  </div>

  <div class="grid" id="grid" role="group" aria-label="Picture choices"></div>

  <div class="feedback idle" id="feedback" role="status" aria-live="polite">Tap the picture that matches the fraction above.</div>

  <footer>
    <button class="newq" id="newQBtn">🔄 New Question</button>
    <span class="hint">Denominators up to 12</span>
  </footer>
</div>

<script>
const COLORS = ['#D6473C', '#3E6B9E', '#E8A63B', '#5E9C4C', '#8756A8', '#2F9E9E'];

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }

function pieSVG(n, d, color) {
  const size = 108, r = 46, cx = size/2, cy = size/2;
  let paths = '';
  for (let i = 0; i < d; i++) {
    const a0 = -Math.PI/2 + i * (2*Math.PI/d);
    const a1 = -Math.PI/2 + (i+1) * (2*Math.PI/d);
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const largeArc = (a1 - a0) > Math.PI ? 1 : 0;
    const fill = i < n ? color : '#FFFFFF';
    paths += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${fill}" stroke="#3B2A20" stroke-width="1.4" stroke-opacity="0.55"/>`;
  }
  return `<svg class="plate" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="${cx}" cy="${cy+2}" rx="${r+4}" ry="${r+4}" fill="none" stroke="#3B2A20" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.3"/>
    ${paths}
  </svg>`;
}

function keyOf(n, d) { return `${n}/${d}`; }

function makeDistractors(n, d) {
  const out = [];
  const seen = new Set([keyOf(n, d)]);

  function tryAdd(nn, dd) {
    if (dd < 2 || dd > 12) return false;
    if (nn < 1 || nn > dd - 1) return false;
    const k = keyOf(nn, dd);
    if (seen.has(k)) return false;
    seen.add(k);
    out.push([nn, dd]);
    return true;
  }

  // 1) complement: shade the "leftover" part instead (classic shading mistake)
  tryAdd(d - n, d);

  // 2) off-by-one numerator, same denominator
  const offCandidates = [n - 1, n + 1, n - 2, n + 2];
  for (const cand of offCandidates) {
    if (out.length >= 2) break;
    tryAdd(cand, d);
  }

  // 3) denominator confusion: same numerator, neighbouring denominator
  const denCandidates = [d - 1, d + 1, d - 2, d + 2];
  for (const cand of denCandidates) {
    if (out.length >= 3) break;
    tryAdd(n, cand);
  }

  // fallback: random plausible fractions if still short
  let guard = 0;
  while (out.length < 3 && guard < 200) {
    guard++;
    const dd = randInt(2, 12);
    const nn = randInt(1, dd - 1);
    tryAdd(nn, dd);
  }

  return out.slice(0, 3);
}

function generateQuestion() {
  const d = randInt(2, 12);
  const n = randInt(1, d - 1);
  const distractors = makeDistractors(n, d);
  const options = [[n, d], ...distractors];
  // shuffle
  for (let i = options.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [options[i], options[j]] = [options[j], options[i]];
  }
  const correctIdx = options.findIndex(([nn, dd]) => nn === n && dd === d);
  return { target: [n, d], options, correctIdx };
}

let question, score = 0, streak = 0, locked = false;

function render() {
  question = generateQuestion();
  locked = false;
  const [n, d] = question.target;
  document.getElementById('targetFrac').innerHTML = `<span class="n">${n}</span><span class="d">${d}</span>`;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  question.options.forEach(([n2, d2], idx) => {
    const color = COLORS[idx % COLORS.length];
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `Picture option ${idx + 1}`);
    card.dataset.idx = idx;
    card.innerHTML = pieSVG(n2, d2, color);
    card.addEventListener('click', () => onPick(idx));
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPick(idx); } });
    grid.appendChild(card);
  });
  setFeedback('idle', 'Tap the picture that matches the fraction above.');
}

function setFeedback(kind, msg) {
  const el = document.getElementById('feedback');
  el.className = `feedback ${kind}`;
  el.textContent = msg;
}

function cardEl(idx) { return document.querySelector(`.card[data-idx="${idx}"]`); }

function onPick(idx) {
  if (locked) return;
  locked = true;
  document.querySelectorAll('.card').forEach(c => c.classList.add('disabled'));

  const [n, d] = question.target;

  if (idx === question.correctIdx) {
    cardEl(idx).classList.remove('disabled');
    cardEl(idx).classList.add('correct');
    score++; streak++;
    document.getElementById('scoreNum').textContent = score;
    document.getElementById('streakNum').textContent = streak;
    setFeedback('good', `Yes! That picture shows ${n}/${d}. Next question coming up!`);
    setTimeout(render, 1400);
  } else {
    cardEl(idx).classList.remove('disabled');
    cardEl(idx).classList.add('incorrect');
    streak = 0;
    document.getElementById('streakNum').textContent = streak;
    setFeedback('bad', `Not quite. Look again — which picture really shows ${n}/${d}?`);
    setTimeout(() => {
      cardEl(idx).classList.remove('incorrect');
      document.querySelectorAll('.card').forEach(c => c.classList.remove('disabled'));
      locked = false;
    }, 900);
  }
}

document.getElementById('newQBtn').addEventListener('click', () => { render(); });

render();
</script>
</body>
</html>
