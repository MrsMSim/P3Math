<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraction Pie Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF1DE;
    --ink: #3B2A20;
    --ink-soft: #6B584A;
    --card: #FFFFFF;
    --plum: #7B3F61;
    --plum-dark: #5E2F4B;
    --success: #4C9A5B;
    --success-bg: #E7F3E9;
    --error: #C4453A;
    --error-bg: #FBEAE8;
    --ring: #E8A63B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(123,63,97,0.06) 0, transparent 40%),
      radial-gradient(circle at 92% 88%, rgba(232,166,59,0.10) 0, transparent 40%);
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 28px 16px 60px;
  }

  .wrap { width: 100%; max-width: 780px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 38px);
    margin: 0;
    color: var(--plum-dark);
    letter-spacing: -0.01em;
  }

  .subtitle {
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 16px;
    font-weight: 600;
  }

  .badges {
    display: flex;
    gap: 10px;
  }

  .badge {
    background: var(--card);
    border: 2px solid #EEDFC4;
    border-radius: 14px;
    padding: 8px 14px;
    text-align: center;
    min-width: 74px;
    box-shadow: 0 2px 0 #EEDFC4;
  }

  .badge .num {
    font-family: 'Fredoka', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--plum);
    line-height: 1;
  }

  .badge .lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    font-weight: 700;
  }

  .instruction {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 20px;
    margin: 18px 0 20px;
    font-weight: 700;
    font-size: 16px;
    box-shadow: 0 2px 0 #EEDFC4;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .instruction .icon { font-size: 20px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  @media (max-width: 620px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 14px 10px 18px;
    text-align: center;
    cursor: pointer;
    border: 3px solid transparent;
    box-shadow: 0 4px 0 #EEDFC4, 0 4px 10px rgba(59,42,32,0.06);
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    user-select: none;
    position: relative;
  }

  .card:hover { transform: translateY(-3px); }

  .card.selected {
    border-color: var(--ring);
    box-shadow: 0 4px 0 var(--ring), 0 6px 14px rgba(232,166,59,0.25);
  }

  .card.correct {
    border-color: var(--success);
    box-shadow: 0 4px 0 var(--success), 0 6px 14px rgba(76,154,91,0.25);
    animation: pop 0.4s ease;
  }

  .card.incorrect {
    border-color: var(--error);
    animation: shake 0.35s ease;
  }

  .card.dim { opacity: 0.45; pointer-events: none; }

  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .frac {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 22px;
    line-height: 1;
    margin: 0 auto 8px;
    width: fit-content;
  }

  .frac .n { display: block; padding-bottom: 3px; border-bottom: 3px solid var(--ink); }
  .frac .d { display: block; padding-top: 3px; }

  .plate {
    width: 100%;
    max-width: 108px;
    margin: 0 auto;
    filter: drop-shadow(0 3px 2px rgba(59,42,32,0.15));
  }

  .feedback {
    margin-top: 20px;
    border-radius: 16px;
    padding: 16px 20px;
    font-weight: 700;
    font-size: 16px;
    min-height: 26px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .feedback.idle { background: transparent; color: var(--ink-soft); font-weight: 600; }
  .feedback.good { background: var(--success-bg); color: var(--success); }
  .feedback.bad { background: var(--error-bg); color: var(--error); }

  footer {
    margin-top: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  .newround {
    background: var(--plum);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 12px 22px;
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--plum-dark);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .newround:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--plum-dark); }
  .newround:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

  .hint {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .card:focus-visible {
    outline: 3px solid var(--plum);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .newround { transition: none; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Fraction Pie Match</h1>
      <p class="subtitle">Tap two pies that show the same amount.</p>
    </div>
    <div class="badges">
      <div class="badge"><div class="num" id="pairsNum">0/3</div><div class="lbl">Pairs</div></div>
      <div class="badge"><div class="num" id="scoreNum">0</div><div class="lbl">Matches</div></div>
      <div class="badge"><div class="num" id="streakNum">0</div><div class="lbl">Streak</div></div>
    </div>
  </header>

  <div class="instruction"><span class="icon">🥧</span> Match all 3 pairs of equal-size pies — every pie has a partner somewhere!</div>

  <div class="grid" id="grid" role="group" aria-label="Fraction pies"></div>

  <div class="feedback idle" id="feedback" role="status" aria-live="polite">Pick your first pie to get started.</div>

  <footer>
    <button class="newround" id="newRoundBtn">🔄 New Round</button>
    <span class="hint">Denominators up to 12</span>
  </footer>
</div>

<script>
const COLORS = ['#D6473C', '#3E6B9E', '#E8A63B', '#5E9C4C', '#8756A8', '#2F9E9E'];

function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function simplify(n, d) { const g = gcd(n, d); return [n / g, d / g]; }
function valueOf(n, d) { return n / d; }

// Build a pool of "nice" reduced base fractions, denominator of the reduced form kept small
// so scaled-up versions stay visually drawable (<=12 slices).
const BASES = [
  [1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],
  [1,6],[5,6]
];

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }

function scaledVariants(base, maxDen) {
  const [n, d] = base;
  const variants = [];
  for (let k = 1; d * k <= maxDen; k++) variants.push([n * k, d * k]);
  return variants;
}

function shuffleArr(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateRound() {
  const maxDen = 12;

  // pick 3 bases with pairwise-distinct values
  const chosenBases = [];
  let guard = 0;
  while (chosenBases.length < 3 && guard < 200) {
    guard++;
    const b = pick(BASES);
    const v = valueOf(...b).toFixed(6);
    if (chosenBases.some(cb => valueOf(...cb).toFixed(6) === v)) continue;
    chosenBases.push(b);
  }
  if (chosenBases.length < 3) return generateRound(); // retry on rare failure

  const cards = [];
  for (const base of chosenBases) {
    const variants = scaledVariants(base, maxDen);
    if (variants.length < 2) return generateRound(); // retry if a base can't scale twice under 12
    const idxA = randInt(0, variants.length - 1);
    let idxB = randInt(0, variants.length - 1);
    while (idxB === idxA) idxB = randInt(0, variants.length - 1);
    cards.push(variants[idxA], variants[idxB]);
  }

  shuffleArr(cards);
  return { cards };
}

function pieSVG(n, d, color) {
  const size = 108, r = 46, cx = size/2, cy = size/2;
  let paths = '';
  for (let i = 0; i < d; i++) {
    const a0 = -Math.PI/2 + i * (2*Math.PI/d);
    const a1 = -Math.PI/2 + (i+1) * (2*Math.PI/d);
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const largeArc = (a1 - a0) > Math.PI ? 1 : 0;
    const fill = i < n ? color : '#FFFFFF';
    paths += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${fill}" stroke="#3B2A20" stroke-width="1.4" stroke-opacity="0.55"/>`;
  }
  return `<svg class="plate" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="${cx}" cy="${cy+2}" rx="${r+4}" ry="${r+4}" fill="none" stroke="#3B2A20" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.3"/>
    ${paths}
  </svg>`;
}

let round, selected = [], score = 0, streak = 0, locked = false, anchorAttempts = 0, matched = new Set(), pairsFound = 0;

function render() {
  round = generateRound();
  selected = [];
  locked = false;
  anchorAttempts = 0;
  matched = new Set();
  pairsFound = 0;
  document.getElementById('pairsNum').textContent = `${pairsFound}/3`;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  round.cards.forEach((frac, idx) => {
    const [n, d] = frac;
    const color = COLORS[idx % COLORS.length];
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `${n} over ${d}`);
    card.dataset.idx = idx;
    card.innerHTML = `
      <div class="frac"><span class="n">${n}</span><span class="d">${d}</span></div>
      ${pieSVG(n, d, color)}
    `;
    card.addEventListener('click', () => onPick(idx));
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPick(idx); } });
    grid.appendChild(card);
  });
  setFeedback('idle', 'Every pie has a match somewhere — pick your first pie to get started.');
}

function setFeedback(kind, msg) {
  const el = document.getElementById('feedback');
  el.className = `feedback ${kind}`;
  el.textContent = msg;
}

function cardEl(idx) { return document.querySelector(`.card[data-idx="${idx}"]`); }

function onPick(idx) {
  if (locked) return;
  if (matched.has(idx)) return;

  // tapping the current lone selection again deselects it
  if (selected.length === 1 && selected[0] === idx) {
    cardEl(idx).classList.remove('selected');
    selected = [];
    anchorAttempts = 0;
    setFeedback('idle', 'Pick your first pie to get started.');
    return;
  }

  if (selected.includes(idx)) return;
  selected.push(idx);
  cardEl(idx).classList.add('selected');

  if (selected.length === 1) {
    anchorAttempts = 0;
    setFeedback('idle', 'Now pick the pie that matches it — tap it again to choose a different one.');
    return;
  }

  // two selected -> evaluate
  locked = true;
  const [i1, i2] = selected;
  const [n1, d1] = round.cards[i1];
  const [n2, d2] = round.cards[i2];
  const isMatch = n1 * d2 === n2 * d1; // cross-multiplication equality

  if (isMatch) {
    cardEl(i1).classList.remove('selected'); cardEl(i1).classList.add('correct');
    cardEl(i2).classList.remove('selected'); cardEl(i2).classList.add('correct');
    matched.add(i1); matched.add(i2);
    pairsFound++;
    score++; streak++;
    anchorAttempts = 0;
    document.getElementById('scoreNum').textContent = score;
    document.getElementById('streakNum').textContent = streak;
    document.getElementById('pairsNum').textContent = `${pairsFound}/3`;

    setTimeout(() => {
      cardEl(i1).classList.add('dim');
      cardEl(i2).classList.add('dim');
      selected = [];
      locked = false;

      if (pairsFound >= 3) {
        setFeedback('good', `All 3 pairs found! Amazing work — starting a new round!`);
        setTimeout(render, 1600);
      } else {
        setFeedback('good', `Yes! ${n1}/${d1} and ${n2}/${d2} are the same size. ${3 - pairsFound} pair${3 - pairsFound === 1 ? '' : 's'} left to find.`);
      }
    }, 700);
  } else {
    cardEl(i1).classList.add('incorrect');
    cardEl(i2).classList.add('incorrect');
    streak = 0;
    anchorAttempts++;
    document.getElementById('streakNum').textContent = streak;

    const anchor = i1; // the card the student is keeping as their anchor
    const tried = i2;

    setTimeout(() => {
      // keep the anchor selected, only release the second (wrong) guess
      cardEl(anchor).classList.remove('incorrect');
      cardEl(tried).classList.remove('selected', 'incorrect');
      selected = [anchor];
      locked = false;
      setFeedback('bad', `Not quite — ${n1}/${d1} and ${n2}/${d2} aren't equal. Keep trying with the same pie, or tap it again to switch.`);
    }, 900);
  }
}

document.getElementById('newRoundBtn').addEventListener('click', () => { render(); });

render();
</script>
</body>
</html>
